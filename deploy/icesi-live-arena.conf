# Sitio de Nginx para Icesi Live Arena (D-043). Lo copia install.sh a /etc/nginx/sites-available/.
server {
    # Único sitio de la VM: atiende cualquier nombre o IP en el puerto 80
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Solo el resultado de `npm run build` (dist/), nunca src/ ni node_modules/
    root /var/www/icesi-live-arena;
    index index.html;

    # Compresión al vuelo de JS y CSS (Sesión 12)
    gzip on;
    gzip_types text/plain text/css application/javascript;

    # Cualquier ruta que no sea un archivo devuelve la taquilla (SPA)
    location / {
        try_files $uri /index.html;
    }

    # El nombre del bundle lleva [contenthash]: si el código cambia, cambia el nombre
    location ~* ^/bundle\..+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Canal WebSocket de Ice: /ws del navegador -> servidor Java local en el 10002
    location /ws {
        proxy_pass http://127.0.0.1:10002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Ice manda un latido cada 30 s (api.js); 120 s evita que Nginx corte la conexión
        proxy_read_timeout 120s;
    }
}
