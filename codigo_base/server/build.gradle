plugins {
    id 'application'
}

dependencies {
    implementation project(':common')
}

application {
    mainClass = 'co.icesi.booking.server.BookingServerApp'
}

task runServer(type: JavaExec) {
    mainClass = 'co.icesi.booking.server.BookingServerApp'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}

// Jar ejecutable para la VM (D-045): incluye Ice y common para correr con `java -jar server.jar`
jar {
    archiveFileName = 'server.jar'
    dependsOn configurations.runtimeClasspath
    manifest {
        attributes 'Main-Class': 'co.icesi.booking.server.BookingServerApp'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
